<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet"><style>
:root{--bg:#17101f;--p:#221832;--p2:#2c2040;--ln:#45336a;--sh:#0b0712;--tx:#efe6d8;--mu:#a99bb8;--sg:#9bbf8a;--li:#b49be0;--am:#e3a857;--ro:#d98aa3;--sk:#7fb5d6;--bad:#e07a6a}

.mod{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:18px}.mod>div{max-width:1100px;margin:auto}

.gr path{fill:none;stroke:var(--li);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 12;animation:fw .8s linear infinite;transition:.2s}.gr path.z{stroke:var(--sg)}@keyframes fw{to{stroke-dashoffset:-13}}.gr svg.dim path{opacity:.12}.gr svg.dim path.on{opacity:1;stroke-width:7}
.nd{background:var(--p);border:2.5px solid var(--ln);border-radius:18px;box-shadow:5px 5px 0 var(--sh);padding:12px;transition:.15s}.nd.in,.nd.rs{cursor:pointer}.nd.in:hover,.nd.rs:hover{border-color:var(--sg);transform:translateX(3px)}.nd.rc{border-color:var(--am)}.nd.rs{border-color:var(--sg)}.nd .hint{color:var(--sg);font-size:12px}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--p);border-left:3px solid var(--ln);z-index:60;padding:22px;overflow:auto;transform:translateX(105%);transition:.3s}#dr.on{transform:none;box-shadow:-20px 0 60px #000b}#dr textarea{width:100%;min-height:120px;white-space:pre-wrap}.pw{white-space:pre-wrap;background:var(--p2);border-radius:12px;padding:12px}
.nt{background:#e9d48a;color:#2a2008;transform:rotate(1deg);border-color:#0e0914}.nt h3{color:#5a4410}.nt textarea{width:100%;height:120px;background:transparent;border:0;border-bottom:2px dashed #5a4410;border-radius:0;color:#2a2008;resize:none}

.dk{background:none;border:0;border-radius:18px;padding:7px 13px;color:var(--mu);display:flex;flex-direction:column;align-items:center;font:700 11px Nunito;cursor:pointer;box-shadow:none;white-space:nowrap}.dk span{font-size:20px}.dk:hover{color:var(--tx);background:var(--p2)}.dk.on{background:var(--li);color:#1a1226}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--sg);color:#10200a;border:2px solid #0e0914;box-shadow:4px 4px 0 var(--sh);padding:9px 18px;border-radius:14px;z-index:70;display:none;font-weight:800}

<script>
const $=s=>document.querySelector(s),M=(a,f)=>a.map(f).join(''),f=n=>(Math.round(n*100)/100).toLocaleString('uk'),$$=n=>'$'+f(n),LF=c=>`<svg class="lf ${c||''}"><use href=#lf /></svg>`;
const T=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600);return(h?h+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
/* маскот: кіт Димок */
const MS=`<svg class=ms viewBox="0 0 220 210"><g stroke="#0e0914" stroke-width="5" stroke-linejoin="round"><path d="M38 86L30 22l50 30z" fill="#e3a857"/><path d="M182 86l8-64-50 30z" fill="#e3a857"/><path d="M42 70l-4-30 24 16z" fill="#d98aa3" stroke="none"/><path d="M178 70l4-30-24 16z" fill="#d98aa3" stroke="none"/><path d="M26 120C26 62 70 44 110 44s84 18 84 76c0 46-36 70-84 70s-84-24-84-70z" fill="#e3a857"/></g><path d="M58 56l6 18M162 56l-6 18M40 104l16 4M180 104l-16 4" stroke="#b8742c" stroke-width="6" stroke-linecap="round"/><ellipse cx=110 cy=152 rx=38 ry=26 fill="#f6e3c0"/><g stroke="#0e0914" stroke-width="4"><ellipse cx=72 cy=112 rx=22 ry=20 fill="#fff"/><ellipse cx=148 cy=112 rx=22 ry=20 fill="#fff"/></g><circle cx=76 cy=120 r=12 fill="#9bbf8a"/><circle cx=144 cy=120 r=12 fill="#9bbf8a"/><circle cx=77 cy=121 r=6 fill="#0e0914"/><circle cx=143 cy=121 r=6 fill="#0e0914"/><g class=bl stroke="#0e0914" stroke-width="4.5" fill="#e3a857"><path d="M47 112a25 22 0 0 1 50 0z"/><path d="M123 112a25 22 0 0 1 50 0z"/></g><path d="M101 139h18l-9 10z" fill="#d98aa3" stroke="#0e0914" stroke-width="3" stroke-linejoin="round"/><path d="M110 149v7M110 156q-9 8-17 1M110 156q9 8 17 1" fill=none stroke="#0e0914" stroke-width="3.5" stroke-linecap="round"/><path d="M62 152l-42-8M62 160l-40 10M158 152l42-8M158 160l40 10" stroke="#f6e3c0" stroke-width="3" stroke-linecap="round"/><g transform="rotate(-12 124 162)"><rect x=120 y=157 width=58 height=10 rx=5 fill="#fff" stroke="#0e0914" stroke-width="3.5"/><circle cx=180 cy=162 r=7 fill="#e8803a" stroke="#0e0914" stroke-width="3"/></g><use href=#lf x=86 y=18 width=48 height=48 style="fill:#9bbf8a;stroke:#0e0914;stroke-width:6" /><g fill="#efe6d8" stroke="#0e0914" stroke-width="3"><circle class=sm cx=188 cy=146 r=8 /><circle class=sm style="animation-delay:1.1s" cx=188 cy=146 r=8 /><circle class=sm style="animation-delay:2.2s" cx=188 cy=146 r=8 /></g></svg>`;
const buddy=t=>`<div class=bd>${MS}<div class=bub>${t}</div></div>`;
const seed=()=>({items:[['leafd','🍂','Висушене тютюнове листя',500,2,0,'Сушарня'],['paper','📄','Папір',100,5,0,'Магазин'],['ink','🖋️','Чорнило',100,8,0,'Магазин'],['sugar','🍬','Цукор',100,3,0,'Магазин'],['sap','🪵','Деревний сік',100,4,0,'Ліс'],['leaf','🌿','Тютюнове листя',100,2,0,'Ферма'],['sulfur','🟡','Сірка',50,6,0,'Шахта'],['beam','🪵','Брус',50,7,0,'Лісопилка'],
['cheap','🚬','Блок дешевих цигарок',0,0,600,''],['prem','💎','Блок преміальних цигарок',0,0,1500,''],['chew','🟤','Блок жувального тютюну',0,0,400,''],['cigar','🪘','Коробка сигар',0,0,700,''],['match','🔥','Блок сірників',0,0,350,''],['smoke','🍃','Курильний тютюн',0,0,3,'']].map(a=>({id:a[0],e:a[1],n:a[2],q:a[3],p:a[4],s:a[5],w:a[6]})),
recipes:[['cheap','🚬','Цигарки',1,1800,5,1,[['leafd',150],['paper',5],['ink',5]]],['prem','💎','Цигарки',2,1800,7,1,[['leafd',300],['paper',10],['ink',20]]],['chew','🟤','Жувальний тютюн',1,900,3,1,[['leafd',100],['sugar',20],['sap',20]]],['cigar','🪘','Цигарки',3,900,10,1,[['leafd',100],['leaf',20],['paper',10]]],['match','🔥','Сірники',1,1800,1,1,[['sulfur',5],['beam',5],['paper',25]]],['smoke','🍃','Тютюн',1,180,0,50,[['leafd',100]]]].map(a=>({id:a[0],e:a[1],cat:a[2],sk:a[3],t:a[4],xp:a[5],out:a[6],ing:a[7]})),crafts:[],notes:'Правила, контакти, постачальники...',cfg:{}});
let D;try{D=JSON.parse(localStorage.ul)}catch(e){}D=D||seed();let adm=sessionStorage.adm=='1';
const I=id=>D.items.find(i=>i.id==id)||{n:'?',e:'❓',p:0,q:0,s:0,w:''},R=id=>D.recipes.find(r=>r.id==id),CO=['#9bbf8a','#b49be0','#e3a857','#d98aa3','#7fb5d6','#d9c7a0'];
const cost=r=>r.ing.reduce((s,[i,q])=>s+q*I(i).p,0),unit=r=>cost(r)/r.out,sp=r=>I(r.id).s||0,mg=r=>sp(r)?(sp(r)-unit(r))/sp(r)*100:0,ph=r=>(sp(r)*r.out-cost(r))/(r.t/3600),can=r=>Math.min(...r.ing.map(([i,q])=>Math.floor(I(i).q/q)));
const act=()=>D.crafts.filter(c=>!c.col),H0=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)+'';
function say(){const rd=act().find(c=>c.end<=Date.now());if(rd)return'Крафт готовий. Забирай, поки не охолов 📦';for(const r of D.recipes)for(const[i,q]of r.ing)if(I(i).q<q)return`На «${I(r.id).n}» бракує «${I(i).n}». Докупи, бро 🛒`;const b=[...D.recipes].sort((a,b)=>ph(b)-ph(a))[0];return b?`Найвигідніше за годину: ${b.e} ${I(b.id).n}, ${$$(ph(b))}/год. Варимо?`:'Додай рецепти, і я порахую все сам'}
let to;function save(){localStorage.ul=JSON.stringify(D);clearTimeout(to);to=setTimeout(()=>post({action:'save',data:{...D,cfg:undefined}}),1500)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
async function post(o){if(!D.cfg.url)return;try{const j=await(await fetch(D.cfg.url,{method:'POST',body:JSON.stringify({...o,key:D.cfg.key})})).json();if(j.crafts)recon(j.crafts);return j}catch(e){toast('Sync ✗')}}
async function pull(full){if(!D.cfg.url)return;try{const j=await(await fetch(D.cfg.url+'?key='+encodeURIComponent(D.cfg.key))).json();if(full&&j.state){D={...j.state,cfg:D.cfg};localStorage.ul=JSON.stringify(D);tab(cur);toast('Завантажено з Google Sheets')}recon(j.crafts||[])}catch(e){toast('Sync ✗')}}
function recon(sc){let ch=0;D.crafts.forEach(c=>{const s=sc.find(x=>x.id==c.id);if(s&&s.collected&&!c.col){take(c.id,1);ch=1}});if(ch)tab(cur)}
function take(id,rm){const c=D.crafts.find(x=>x.id==id);if(!c||c.col)return;const r=R(c.rid);c.col=1;I(r.id).q+=r.out*c.cy;localStorage.ul=JSON.stringify(D);if(!rm){post({action:'collect',id});toast('Забрано на склад 🌿');tab(cur)}}
function go(rid,cy){const r=R(rid);if(r.ing.some(([i,q])=>I(i).q<q*cy))return toast('Не вистачає сировини');r.ing.forEach(([i,q])=>I(i).q-=q*cy);const n=Date.now(),c={id:'c'+n,rid,cy,st:n,end:n+r.t*1000*cy,col:0};D.crafts.push(c);save();post({action:'craft',id:c.id,name:I(r.id).n+' ×'+cy*r.out,emoji:r.e,qty:cy*r.out,end:c.end});toast('Крафт запущено ⚡');tab('crafts')}
